[tool.poetry]
name = "DiretoraVirtualAgent"
version = "0.1.0"
description = "An AutoGPT Forge agent acting as a Virtual Director to manage complex projects via specialized AI agent teams."
authors = ["Your Name <you@example.com>"] # Placeholder
license = "MIT"
readme = "README.md" # A README will need to be created

packages = [{ include = "forge" }]

[tool.poetry.dependencies]
python = ">=3.10, <4.0"
# Common Forge agent dependencies
click = "*"
python-dotenv = "^1.0.0"
pyyaml = "^6.0"
# DiretoraVirtualAgent relies on LLMs via forge.sdk.
# It uses 'enum' from standard library.

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.20"
# black, isort, mypy, etc.

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
